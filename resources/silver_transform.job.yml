resources:
  jobs:
    silver_transform:
      name: silver_transform

      trigger:
        table_update:
          condition: ANY_UPDATED
          table_names:
            - ${var.catalog}.${var.bronze_schema}.viajes
            - ${var.catalog}.${var.bronze_schema}.horarios_variante
            - ${var.catalog}.${var.bronze_schema}.horarios_circular
            - ${var.catalog}.${var.bronze_schema}.paradas

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}

      tasks:
        - task_key: silver_viajes
          notebook_task:
            notebook_path: ../src/notebooks/silver/silver_viajes.py
          environment_key: default

        - task_key: silver_horarios_variante
          notebook_task:
            notebook_path: ../src/notebooks/silver/silver_horarios_variante.py
          environment_key: default

        - task_key: silver_horarios_circular
          notebook_task:
            notebook_path: ../src/notebooks/silver/silver_horarios_circular.py
          environment_key: default

        - task_key: silver_paradas
          notebook_task:
            notebook_path: ../src/notebooks/silver/silver_paradas.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
