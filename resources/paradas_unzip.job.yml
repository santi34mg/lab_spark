resources:
  jobs:
    paradas_unzip:
      name: paradas_unzip
      description: One shot - descomprime los .zip de paradas STM (shapefile) del volume paradas en shp/.

      # Sin trigger/schedule: se ejecuta manualmente (databricks bundle run paradas_unzip).
      timeout_seconds: 3600

      # El volume paradas no lo gestiona el bundle: se referencia por nombre.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: volume
          default: paradas
        - name: zips_subdir
          default: zip
        # El zip de paradas trae un shapefile (.shp, .dbf, .shx, ...), no CSVs
        - name: output_subdir
          default: shp

      tasks:
        - task_key: unzip_shp
          notebook_task:
            notebook_path: ../src/notebooks/os_unzip.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
