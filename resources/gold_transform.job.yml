resources:
  jobs:
    gold_transform:
      name: gold_transform
      description: Agrega las tablas silver STM en las métricas gold que consume el dashboard de la IM.

      # Corre cuando se actualizan las tablas silver que usa (en target dev el trigger queda pausado).
      # wait_after_last_change espera a que silver_transform termine de escribir todas sus tablas.
      trigger:
        table_update:
          condition: ANY_UPDATED
          table_names:
            - ${var.catalog}.${var.silver_schema}.viajes
            - ${var.catalog}.${var.silver_schema}.horarios_variante
            - ${var.catalog}.${var.silver_schema}.paradas
          wait_after_last_change_seconds: 1800
          min_time_between_triggers_seconds: 3600

      timeout_seconds: 7200

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}

      tasks:
        # Primero: el resto de las tareas usa demanda_dia (días atípicos y ventana de análisis)
        - task_key: gold_demanda
          notebook_task:
            notebook_path: ../src/notebooks/gold/gold_demanda.py
          environment_key: default

        - task_key: gold_lineas
          depends_on:
            - task_key: gold_demanda
          notebook_task:
            notebook_path: ../src/notebooks/gold/gold_lineas.py
          environment_key: default

        - task_key: gold_paradas
          depends_on:
            - task_key: gold_demanda
          notebook_task:
            notebook_path: ../src/notebooks/gold/gold_paradas.py
          environment_key: default

        - task_key: gold_transbordos
          depends_on:
            - task_key: gold_demanda
          notebook_task:
            notebook_path: ../src/notebooks/gold/gold_transbordos.py
          environment_key: default

        # Independiente del resto: compara bronze con silver
        - task_key: gold_calidad
          notebook_task:
            notebook_path: ../src/notebooks/gold/gold_calidad.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
