# This is a Declarative Automation Bundle definition for lab_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lab_databricks
  uuid: 7f0e63cf-37e8-4f5f-bf35-c90bbd0f8a88

include:
  - resources/silver_transform.job.yml
  - variables.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-a90d8050-34f5.cloud.databricks.com
    variables:
      catalog: lab_spark
      schema: brz_stm
      silver_schema: slvr_stm
  prod:
    mode: production
    workspace:
      host: https://dbc-a90d8050-34f5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/santiagosil3434@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/santiagosil3434@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lab_spark
      schema: brz_stm
      silver_schema: slvr_stm
    permissions:
      - user_name: santiagosil3434@gmail.com
        level: CAN_MANAGE
